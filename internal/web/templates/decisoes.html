{{define "conteudo"}}
<nav class="trilha" aria-label="Você está em">
  <a href="/">Matriz</a> / <span>{{.Produto.Nome}}</span> / <span>Decisões</span>
</nav>
<div class="cabecalho">
  <h1>Decisões <span class="do-produto">de {{.Produto.Nome}}</span></h1>
  <p class="subtitulo">Conteúdo do DECISIONS.md do produto, no repo central.</p>
</div>
<article class="documento documento-largo">
  {{if .Doc.Aviso}}<p class="nota">{{.Doc.Aviso}}</p>{{end}}
  <div class="markdown">{{.Doc.HTML}}</div>
</article>
{{end}}
